<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#161d3a" />
      <stop offset="60%" stop-color="#0b0e1d" />
      <stop offset="100%" stop-color="#06060e" />
    </radialGradient>
    <radialGradient id="orb" cx="44%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#f2fdff" />
      <stop offset="32%" stop-color="#7be8ff" />
      <stop offset="66%" stop-color="#5a6cff" />
      <stop offset="100%" stop-color="#8a2bff" />
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9bf0ff" />
      <stop offset="50%" stop-color="#b06bff" />
      <stop offset="100%" stop-color="#6a7bff" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)" />

  <!-- orbital ring (back half) -->
  <g transform="rotate(-26 256 256)" filter="url(#glow)">
    <ellipse cx="256" cy="256" rx="178" ry="66" fill="none"
             stroke="url(#ring)" stroke-width="9" opacity="0.55" />
  </g>

  <!-- energy orb -->
  <circle cx="256" cy="244" r="98" fill="url(#orb)" filter="url(#glow)" />
  <!-- soft inner highlight -->
  <circle cx="226" cy="212" r="30" fill="#ffffff" opacity="0.35" />

  <!-- orbital ring (front half, passes over the orb) -->
  <g transform="rotate(-26 256 256)">
    <path d="M 78 256 A 178 66 0 0 0 434 256" fill="none"
          stroke="url(#ring)" stroke-width="11" stroke-linecap="round" opacity="0.98" />
  </g>
</svg>
