<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#161d3a" />
      <stop offset="60%" stop-color="#0b0e1d" />
      <stop offset="100%" stop-color="#06060e" />
    </radialGradient>
    <radialGradient id="blob" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#f2fdff" />
      <stop offset="30%" stop-color="#7be8ff" />
      <stop offset="64%" stop-color="#5a6cff" />
      <stop offset="100%" stop-color="#8a2bff" />
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)" />

  <!-- gooey slime blob: one soft body + a single drip -->
  <g filter="url(#glow)">
    <path d="M250 120
             C336 116 398 176 392 252
             C388 314 356 372 292 384
             C220 398 130 356 122 268
             C116 196 168 124 250 120 Z"
          fill="url(#blob)" />
    <circle cx="296" cy="392" r="26" fill="url(#blob)" />
  </g>

  <!-- wet sheen -->
  <ellipse cx="210" cy="198" rx="44" ry="30" fill="#ffffff" opacity="0.36"
           transform="rotate(-22 210 198)" />
  <circle cx="300" cy="384" r="9" fill="#ffffff" opacity="0.45" />
</svg>
