<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether — audio-reactive visualizer</title>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="drop-hint" class="drop-hint">
      <strong>Aether</strong>
      Hit <em>🖥 System audio</em> to react to your device, or <em>🎤 Mic</em>.
    </div>

    <div class="hud">
      <div class="brand">Aether <span>· slime</span></div>
      <div class="meters">
        <div class="meter"><span class="bar" id="bar-bass"></span><label>BASS</label></div>
        <div class="meter"><span class="bar" id="bar-mid"></span><label>MID</label></div>
        <div class="meter"><span class="bar" id="bar-treble"></span><label>TREB</label></div>
        <div class="beat" id="beat">BEAT</div>
      </div>
    </div>

    <div class="controls">
      <button id="btn-system" title="React to audio playing on your device">🖥 System audio</button>
      <button id="btn-mic" title="Listen via microphone">🎤 Mic</button>
      <button id="btn-style" title="Switch visual style (or press S)">◆ slime</button>
      <button id="btn-full" title="Fullscreen on this monitor (or double-click)">⛶ Fullscreen</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
