<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether — audio-reactive visualizer</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="drag-layer"></div>
    <button id="edit-handle" title="Edit overlay — leave click-through (or press Ctrl+Shift+O)" aria-label="Edit overlay">✎</button>

    <div id="drop-hint" class="drop-hint">
      <strong>Aether</strong>
      Tap <em>motion</em> to switch between moving on its own and reacting to audio.
    </div>

    <div class="hud">
      <div class="brand">Aether <span>· slime</span></div>
      <div class="meters">
        <div class="meter"><span class="bar" id="bar-bass"></span><label>BASS</label></div>
        <div class="meter"><span class="bar" id="bar-mid"></span><label>MID</label></div>
        <div class="meter"><span class="bar" id="bar-treble"></span><label>TREB</label></div>
        <div class="beat" id="beat">BEAT</div>
      </div>
    </div>

    <div class="controls">
      <button id="btn-audio" title="Motion: moves on its own → reacts to device audio → reacts to mic">◇ self</button>
      <button id="btn-bg" title="Background: transparent or solid black">▣ black</button>
      <button id="btn-through" title="Click-through: see the visuals but type/click into apps behind it (toggle with Ctrl+Shift+O)">⊘ thru</button>
      <button id="btn-style" title="Switch visual style (or press S)">◆ slime</button>
    </div>

    <button id="btn-close" type="button" title="Close (or Ctrl+Shift+Q)" aria-label="Close">×</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
